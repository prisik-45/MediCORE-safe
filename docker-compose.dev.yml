services:
  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:-medicore-local-valkey-password}
      - --appendonly
      - "yes"
    
    volumes:
      - valkey_dev_data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - -a
        - ${VALKEY_PASSWORD:-medicore-local-valkey-password}
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medicore-api:dev
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      VALKEY_URL: ${VALKEY_URL:-redis://:${VALKEY_PASSWORD:-medicore-local-valkey-password}@valkey:6379/0}
      REDIS_URL: ${VALKEY_URL:-redis://:${VALKEY_PASSWORD:-medicore-local-valkey-password}@valkey:6379/0}
    
     
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro 
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medicore-worker:dev
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      VALKEY_URL: ${VALKEY_URL:-redis://:${VALKEY_PASSWORD:-medicore-local-valkey-password}@valkey:6379/0}
      REDIS_URL: ${VALKEY_URL:-redis://:${VALKEY_PASSWORD:-medicore-local-valkey-password}@valkey:6379/0}
    command:
      - celery
      - -A
      - backend.app.tasks
      - worker
      - --loglevel=info
      - -Q
      - celery,ingest
    volumes:
      - ./backend:/app/backend
    depends_on:
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - celery
        - -A
        - backend.app.tasks
        - inspect
        - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    
    image: medicore-frontend:dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://api:8000/ws/chat}
      
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
      - frontend_dev_next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  valkey_dev_data:
  frontend_dev_node_modules:
  frontend_dev_next:
