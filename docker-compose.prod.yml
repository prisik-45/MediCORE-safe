services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - valkey_prod_data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - -a
        - ${VALKEY_PASSWORD}
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medicore-api:${MEDICORE_IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      APP_NAME: MediCORE
      API_BASE_URL: ${API_BASE_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    expose:
      - "8000"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medicore-worker:${MEDICORE_IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      APP_NAME: MediCORE
      API_BASE_URL: ${API_BASE_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    command:
      - uv
      - run
      - celery
      - -A
      - backend.app.tasks
      - worker
      - --loglevel=info
    depends_on:
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: medicore-frontend:${MEDICORE_IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  db-backup:
    image: postgres:16-alpine
    profiles:
      - backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_INTERVAL_SECONDS: ${DB_BACKUP_INTERVAL_SECONDS:-86400}
      PGPASSWORD: ${SUPABASE_DB_PASSWORD}
    volumes:
      - ./backups/database:/backups/database
    command:
      - sh
      - -c
      - |
        set -eu
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump \
            --host "$$SUPABASE_DB_HOST" \
            --port "$${SUPABASE_DB_PORT:-5432}" \
            --username "$$SUPABASE_DB_USER" \
            --dbname "$$SUPABASE_DB_NAME" \
            --format custom \
            --no-owner \
            --no-privileges \
            --file "/backups/database/medicore-db-$$ts.dump"
          find /backups/database -type f -name 'medicore-db-*.dump' -mtime +${DB_BACKUP_RETENTION_DAYS:-14} -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  certificate-pdf-backup:
    image: rclone/rclone:1
    profiles:
      - backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_INTERVAL_SECONDS: ${CERTIFICATE_BACKUP_INTERVAL_SECONDS:-86400}
      RCLONE_CONFIG_SUPABASE_TYPE: s3
      RCLONE_CONFIG_SUPABASE_PROVIDER: Other
      RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${SUPABASE_STORAGE_S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_SUPABASE_ENDPOINT: ${SUPABASE_STORAGE_S3_ENDPOINT}
      RCLONE_CONFIG_SUPABASE_REGION: ${SUPABASE_STORAGE_S3_REGION:-auto}
    volumes:
      - ./backups/certificate-pdfs:/backups/certificate-pdfs
    command:
      - sh
      - -c
      - |
        set -eu
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p "/backups/certificate-pdfs/$$ts"
          rclone sync "supabase:${SUPABASE_STORAGE_BUCKET:-catalog-pdfs}" "/backups/certificate-pdfs/$$ts"
          find /backups/certificate-pdfs -mindepth 1 -maxdepth 1 -type d -mtime +${CERTIFICATE_BACKUP_RETENTION_DAYS:-30} -exec rm -rf {} +
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  environment-backup:
    image: alpine:3.20
    profiles:
      - backup
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL_SECONDS: ${ENV_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./.env:/source/.env:ro
      - ./backups/environment:/backups/environment
    command:
      - sh
      - -c
      - |
        set -eu
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          cp /source/.env "/backups/environment/env-development-$$ts"
          chmod 600 "/backups/environment/env-development-$$ts"
          find /backups/environment -type f -name 'env-development-*' -mtime +${ENV_BACKUP_RETENTION_DAYS:-30} -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  valkey_prod_data:
  certbot_conf:
  certbot_www:
